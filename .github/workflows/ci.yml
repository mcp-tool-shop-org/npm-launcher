name: CI

on:
  push:
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "atlas/**"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "atlas/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # Atlas requires Node 22 or later, so the check runs on the 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.20.0 check
      - run: npm test
      - run: node bin/mcptoolshop-launch.js --version
      - run: node bin/mcptoolshop-launch.js --help
