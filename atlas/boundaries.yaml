summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: backpropagate
    globs:
      - examples/backpropagate/**
    role: code
  - name: bin
    globs:
      - bin/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: sovereignty
    globs:
      - examples/sovereignty/**
    role: code
  - name: src
    globs:
      - src/**
    role: code
  - name: test
    globs:
      - test/**
    role: test
  - name: xrpl-camp
    globs:
      - examples/xrpl-camp/**
    role: code
  - name: xrpl-lab
    globs:
      - examples/xrpl-lab/**
    role: code
