# The bar is 90%, for the repository and for each pull request's changed
# lines (the org standard, set here by the Director's call on 2026-10-22
# while the repository measures 59%). codecov/project stays red until the
# tests reach it; the CI line floor in ci.yml ratchets toward the same 90.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
  require_changes: false
